<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Meridian</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

@font-face {
	font-family: "Nunito";
	src: url("nunito.ttf") format("truetype");
	font-weight: 200 1000;
}

body {
	color: white;
	background-color: #0f1b2d;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #0f1b2d;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-notice {
	display: none;
}

/* Tideline Games loader: the same sunrise as the in-game studio splash (ui/tide_sea.gd).
   The sun rises and the tide lines wash in as the game downloads. */
#tide {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
}

#wordmark {
	position: absolute;
	left: 0;
	right: 0;
	top: 34%;
	transform: translateY(-50%);
	text-align: center;
	font-family: "Nunito", "Avenir Next", "Helvetica Neue", sans-serif;
	opacity: 0;
	transition: opacity 0.6s ease-out;
}

#wordmark .tideline {
	color: #f4efe2;
	font-weight: 900;
	font-size: clamp(36px, 9vmin, 88px);
	letter-spacing: 0.12em;
}

#wordmark .games {
	color: #7fd1c7;
	font-weight: 700;
	font-size: clamp(14px, 2.6vmin, 26px);
	letter-spacing: 0.5em;
	margin-top: 0.1em;
}

/* Under the sea: how much is left, and on a first visit why it takes a moment. */
#loadline {
	position: absolute;
	left: 16px;
	right: 16px;
	bottom: 9%;
	text-align: center;
	font-family: "Nunito", "Avenir Next", "Helvetica Neue", sans-serif;
	color: #c9d6e3;
	font-size: clamp(14px, 2.4vmin, 20px);
	line-height: 1.5;
}

#loadline .first {
	color: #8fa3b8;
	font-size: clamp(13px, 2.1vmin, 17px);
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		#start-button {
 display: none; margin: 16px auto 0; padding: 14px 32px; border: 0; border-radius: 14px;
 background: #ffcd32; color: #132437; font: 900 22px Nunito, sans-serif; cursor: pointer;
}
</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><script src="phone.js"></script><script src="runtime.js"></script>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<canvas id="tide"></canvas>
			<div id="wordmark"><div class="tideline">TIDELINE</div><div class="games">GAMES</div></div>
			<div id="loadline"><div class="what"></div><div class="first"></div><button id="start-button" type="button">Tap to start</button></div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":8066436,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const tide = document.getElementById('tide');
	const wordmark = document.getElementById('wordmark');
	let progress = 0;
	let shown = 0;
	// The download in words: "Loading 12 of 31 MB", then "Starting…". A first visit (no
	// saved copy yet) also says why it takes a moment (Mike, 2026-10-14).
	const loadWhat = document.querySelector('#loadline .what');
	const loadFirst = document.querySelector('#loadline .first');
	const startButton = document.getElementById("start-button");
	const firstVisit = !('serviceWorker' in navigator && navigator.serviceWorker.controller);
	loadWhat.textContent = 'Loading Meridian…';
	if (firstVisit) {
		loadFirst.textContent = 'First visit: downloading the game. Your browser can save it for offline play.';
	}
	function showBytes(current, total) {
		const mb = (b) => Math.max(1, Math.round(b / 1048576));
		loadWhat.textContent = current >= total ? 'Starting…' : `Loading ${mb(current)} of ${mb(total)} MB`;
	}
	const t0 = performance.now();
	// The same drawing as ui/tide_sea.gd: horizon glow, a sun clipped by the sea, its
	// shimmering reflection and three tide lines washing in from the left.
	function drawTide() {
		if (!tide.isConnected) {
			return;
		}
		const dpr = window.devicePixelRatio || 1;
		const w = tide.clientWidth;
		const h = tide.clientHeight;
		if (tide.width !== Math.round(w * dpr)) {
			tide.width = Math.round(w * dpr);
			tide.height = Math.round(h * dpr);
		}
		const g = tide.getContext('2d');
		g.setTransform(dpr, 0, 0, dpr, 0, 0);
		g.clearRect(0, 0, w, h);
		shown += (progress - shown) * 0.12;
		const sun = Math.min(1, shown / 0.7);
		const tideIn = Math.max(0, Math.min(1, (shown - 0.2) / 0.8));
		const time = (performance.now() - t0) / 1000;
		const horizon = h * 0.62;
		for (let i = 0; i < 12; i++) {
			const a = Math.max(0, (0.16 - i * 0.013) * sun);
			g.fillStyle = `rgba(232,135,90,${a})`;
			g.fillRect(0, horizon - 6 - i * 9, w, 9);
		}
		const r = h * 0.13;
		const cy = horizon + r * 1.1 - sun * r * 1.4;
		g.save();
		g.beginPath();
		g.rect(0, 0, w, horizon);
		g.clip();
		g.fillStyle = '#f2c66d';
		g.beginPath();
		g.arc(w / 2, cy, r, 0, Math.PI * 2);
		g.fill();
		g.restore();
		g.fillStyle = '#1c3553';
		g.fillRect(0, horizon, w, h - horizon);
		for (let i = 0; i < 7; i++) {
			const half = r * (0.85 - i * 0.1) * (0.85 + 0.15 * Math.sin(time * 3 + i));
			const a = (0.55 - i * 0.07) * sun;
			if (half > 0 && a > 0) {
				g.fillStyle = `rgba(242,198,109,${a})`;
				g.fillRect(w / 2 - half, horizon + 8 + i * 15, half * 2, 4);
			}
		}
		for (let line = 0; line < 3; line++) {
			const reach = Math.max(0, Math.min(1, tideIn * 1.6 - line * 0.3));
			if (reach <= 0) {
				continue;
			}
			const y0 = horizon + 26 + line * 30;
			const amp = 5 - line;
			g.strokeStyle = `rgba(127,209,199,${0.95 - line * 0.25})`;
			g.lineWidth = 4 - line;
			g.lineCap = 'round';
			g.beginPath();
			for (let k = 0; k <= 80; k++) {
				const x = w * 0.18 + w * 0.64 * reach * k / 80;
				const y = y0 + Math.sin(x * 0.022 + time * 1.4 + line * 1.3) * amp;
				if (k === 0) {
					g.moveTo(x, y);
				} else {
					g.lineTo(x, y);
				}
			}
			g.stroke();
		}
		if (shown > 0.35) {
			wordmark.style.opacity = '1';
		}
		requestAnimationFrame(drawTide);
	}
	requestAnimationFrame(drawTide);
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	// A new build downloads in the background but would wait until every tab and the
	// home-screen app are closed, which on an iPhone is almost never (Mike kept getting an
	// old build, 2026-10-13). Once the game is running, a downloaded build takes over, to be
	// used from the next launch. Never earlier: taking over mid-load mixed the new build's
	// files with the old engine and the game hung on a dark screen.
	function takeUpdate() {
		if (!('serviceWorker' in navigator)) return;
		// startGame starts registration without awaiting it. A first visit must wait
		// for that registration before asking the worker to save the engine files.
		engine.installServiceWorker().then(reg => {
			if (!reg || reg.scope !== window.MeridianWeb.scope) return;
			const take = worker => {
				if (!worker) return;
				worker.postMessage('claim');
				worker.postMessage('cache');
			};
			const watch = worker => {
				if (!worker) return;
				worker.addEventListener('statechange', () => {
					if (worker.state === 'installed' || worker.state === 'activated') take(worker);
				});
			};
			take(reg.waiting || reg.active);
			watch(reg.installing);
			reg.addEventListener('updatefound', () => watch(reg.installing));
			reg.update().catch(() => {});
		}).catch(() => {});
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		// Safety net: a stale saved copy can hang the start (Mike's Firefox on an old build,
		// 2026-10-14). If the download makes no progress for STUCK_MS and the game hasn't
		// started, clear the saved copies once and reload. Progress, not a fixed time, so a
		// slow connection still downloading is left alone; the flag stops a loop.
		const STUCK_MS = 45000;  // generous: compiling the engine after the download reports no progress
		let started = false;
		let lastProgress = -1;
		let lastChange = Date.now();
		const watchdog = setInterval(() => {
			if (started) {
				clearInterval(watchdog);
				return;
			}
			if (progress !== lastProgress) {
				lastProgress = progress;
				lastChange = Date.now();
				return;
			}
			if (Date.now() - lastChange < STUCK_MS) {
				return;
			}
			clearInterval(watchdog);
			let healed = false;
			try {
				healed = sessionStorage.getItem('meridian-healed') === '1';
				sessionStorage.setItem('meridian-healed', '1');
			} catch (e) {
				healed = true;
			}
			if (healed) {
				return;
			}
			window.MeridianWeb.recover().catch(() => {}).then(() => window.location.reload());
		}, 2000);
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					progress = Math.min(1, current / total);
					showBytes(current, total);
				}
			},
		}).then(() => {
			started = true;
			loadWhat.textContent = 'Ready to explore';
			loadFirst.textContent = 'Sound starts when you tap.';
			startButton.style.display = 'block';
			startButton.addEventListener('click', () => {
				if (window.meridianAudioUnlock) window.meridianAudioUnlock();
				setStatusMode('hidden');
				document.getElementById('canvas').focus();
			}, {once: true});
			takeUpdate();
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
